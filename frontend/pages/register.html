<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Register - DEVCOMMON</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <link href="../css/base/tokens.css" rel="stylesheet">
  <link href="../css/pages/auth.css" rel="stylesheet">
</head>
<body>
<main class="min-vh-100 d-flex align-items-center justify-content-center p-3">
  <div class="card auth-card w-100 p-4">
    <h1 class="h4 mb-1">Create your account</h1>
    <p class="text-secondary mb-4">Join the DEVCOMMON community</p>

    <form>
      <div class="mb-3">
        <label for="username" class="form-label">Username</label>
        <input type="text" class="form-control" id="username" minlength="3" required>
      </div>

      <div class="mb-3">
        <label for="email" class="form-label">Email</label>
        <input type="email" class="form-control" id="email" required>
      </div>

      <div class="mb-3">
        <label for="password" class="form-label">Password</label>
        <input type="password" class="form-control" id="password" minlength="8" required>
      </div>

      <div class="mb-3">
        <label for="confirm-password" class="form-label">Confirm password</label>
        <input type="password" class="form-control" id="confirm-password" minlength="8" required>
      </div>

      <div class="form-check mb-3">
        <input class="form-check-input" type="checkbox" id="terms" required>
        <label class="form-check-label" for="terms">I accept the terms</label>
      </div>

      <button type="submit" class="btn btn-gradient w-100">Create account</button>
    </form>

    <p class="text-center text-secondary mt-3 mb-0">
      Already have an account? <a href="login.html">Log in</a>
    </p>
  </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
