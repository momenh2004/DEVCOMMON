<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login - DEVCOMMON</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="../css/base/tokens.css" rel="stylesheet">
  <link href="../css/pages/auth.css" rel="stylesheet">
</head>
<body>
<main class="min-vh-100 d-flex align-items-center justify-content-center p-3">
  <div class="card auth-card w-100 p-4">
    <h1 class="h4 mb-1">Welcome back</h1>
    <p class="text-secondary mb-4">Log in to continue</p>

    <form>
      <div class="mb-3">
        <label for="email" class="form-label">Email</label>
        <input type="email" class="form-control" id="email" required>
      </div>

      <label for="password" class="form-label">Password</label>
      <input type="password" class="form-control" id="password" minlength="8" required>

      <div class="form-check mb-3">
        <input class="form-check-input" type="checkbox" id="remember">
        <label class="form-check-label" for="remember">Remember me</label>
      </div>

      <button type="submit" class="btn btn-gradient w-100">Log in</button>
    </form>

    <p class="text-center text-secondary mt-3 mb-0">
      No account? <a href="register.html">Register</a>
    </p>
  </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
